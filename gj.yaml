AWSTemplateFormatVersion: 2010-09-09
Parameters:
  POSTGRESJDBCURL:  
    Type: String
    Default: "jdbc5432devdb"
  POSTGRESUSER:  
    Type: String
    Default: "Postgres"
  POSTGRESPASS:  
    Type: String
    Default: "Postgres-pass"
    NoEcho: true
  POSTGRESDBNAME:
    Type: String
    Default: "Postgres-DB-name"
  POSTGRESDRIVER:
    Type: String
    Default: "org.postgresql.Driver"
  POSTGRESDRIVERPATH:  
    Type: String
    Default: "s3://ias-reporting-solution-dev/voxanalytics/jar/postgresql-42.6.0.jar"
  ORACLEJDBCURL:  
    Type: String
    Default: "jdbc1521devdb"
  ORACLEUSER:  
    Type: String
    Default: "ITSM"
  ORACLEPASS:  
    Type: String
    Default: "ITSM-pass"
    NoEcho: true                                                                                                     
  REDSHIFTJDBCURL:  
    Type: String
    Default: "jdbc3306devdb"
  REDSHIFTUSER:  
    Type: String
    Default: "master"
  REDSHIFTPASS:  
    Type: String
    Default: "example-password"
    NoEcho: true
  SECRETID:  
    Type: String
    Default: "example-id"
    NoEcho: true
  Environment:  
    Type: String
    Default: dev
  ReportingS3Bucket:
    Type: String
    Default: bucket
  SUBNETID:
    Type: String
    Default: subnet-124466
  SGID:
    Type: String
    Default: sgid-123

Resources:
  PostgresConnection:
    Type: AWS::Glue::Connection
    Properties:
      CatalogId: !Sub ${AWS::AccountId}
      ConnectionInput: 
        ConnectionType: JDBC 
        Description: 'Posgtres DB connection details'
        Name: !Sub ${Environment}-Postgres-conn
        PhysicalConnectionRequirements:
          SecurityGroupIdList:
           - Fn::ImportValue:
              Fn::Sub: ${Environment}-vox-analytics-sg
          SubnetId: !Sub ${SUBNETID}
        ConnectionProperties: {
            "JDBC_CONNECTION_URL": !Ref POSTGRESJDBCURL,
            "USERNAME": !Ref POSTGRESUSER,
            "PASSWORD": !Ref POSTGRESPASS,
            "DRIVERNAME": !Ref POSTGRESDRIVER,
            "DRIVERPATH": !Ref POSTGRESDRIVERPATH,
            "DATABASE_NAME": !Ref POSTGRESDBNAME,
          }

  OracleConnection:
    Type: AWS::Glue::Connection
    Properties:
      CatalogId: !Sub ${AWS::AccountId}
      ConnectionInput: 
        ConnectionType: JDBC 
        Description: 'Oracle DB connection details'
        Name: !Sub ${Environment}-Oracle-conn
        PhysicalConnectionRequirements:
          SecurityGroupIdList:
           - Fn::ImportValue:
              Fn::Sub: ${Environment}-vox-analytics-sg
          SubnetId: !Sub ${SUBNETID}
        ConnectionProperties: {
            "JDBC_CONNECTION_URL": !Ref ORACLEJDBCURL,
            "USERNAME": !Ref ORACLEUSER,
            "PASSWORD": !Ref ORACLEPASS
          }

  RedshiftConnection:
    Type: AWS::Glue::Connection
    Properties:
      CatalogId: !Sub ${AWS::AccountId}
      ConnectionInput: 
        ConnectionType: JDBC 
        Description: 'Redshift DB connection details'
        Name: !Sub ${Environment}-redshift-target
        PhysicalConnectionRequirements:
          SecurityGroupIdList:
           - Fn::ImportValue:
              Fn::Sub: ${Environment}-vox-analytics-sg
          SubnetId: !Sub ${SUBNETID}
        ConnectionProperties: {
            "JDBC_CONNECTION_URL": !Ref REDSHIFTJDBCURL,
            "USERNAME": !Ref REDSHIFTUSER,
            "PASSWORD": !Ref REDSHIFTPASS
          }

  NetworkConnection:
    Type: AWS::Glue::Connection
    Properties:
      CatalogId: !Sub ${AWS::AccountId}
      ConnectionInput: 
        ConnectionType: JDBC 
        Description: 'Network connection'
        Name: !Sub ${Environment}-Network-conn
        PhysicalConnectionRequirements:
          SecurityGroupIdList:
           - Fn::ImportValue:
              Fn::Sub: ${Environment}-vox-analytics-sg
          SubnetId: !Sub ${SUBNETID}
        ConnectionProperties: {
            "JDBC_CONNECTION_URL": !Ref ORACLEJDBCURL,
            "USERNAME": !Ref ORACLEUSER,
            "PASSWORD": !Ref ORACLEPASS
          }

  GlueJob1:
    Type: AWS::Glue::Job
    Properties:
      Command: 
        Name: glueetl
        PythonVersion: 3
        ScriptLocation: !Sub s3://${ReportingS3Bucket}/voxanalytics/${Environment}/main_script_path/vox_analytics_dynamo_staging_job.py
      Connections: 
          Connections: 
          - !Ref RedshiftConnection
      Description: RedshiftS3
      ExecutionProperty: 
        MaxConcurrentRuns: 1 
      GlueVersion: 4.0
      MaxRetries: 0
      Name: !Sub ${Environment}-dynamo_staging
      NumberOfWorkers: 10
      Role:
       Fn::Sub:
        - arn:aws:iam::${AWS::AccountId}:role/CUSPFE-${Environment}-AWSGlueServiceRole
        - Environment: !Ref Environment
      DefaultArguments: 
        --extra-py-files : !Sub s3://${ReportingS3Bucket}/voxanalytics/${Environment}/dependent_libraries/logger.py
        --bucket_name: !Ref ReportingS3Bucket
        --config_file: !Sub voxanalytics/${Environment}/config_files/dynamo_config.json     
      Tags: 
        CostCenterID: 2331084
        EnvType: !Sub ${Environment}
        PrimaryOwner: kenneth.jeckell@pfizer.com
        SecondaryOwner: DL-IAS-Platform-Operations@pfizer.com
        ProjectCode: GPT-VOX-Analytics
        DataClass: Yellow
        Implementor: MG.Maithri@pfizer.com
