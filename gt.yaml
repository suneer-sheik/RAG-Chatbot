  Clsdwflschtime:
    Type: String
    Default: 0 12 * * ? *
  Billwflschtime:
    Type: String
    Default: 30 12 * * ? *
  Apiwflschtime:
    Type: String
    Default: 0 12 * * ? *
  Incwflschtime:
    Type: String
    Default: 0 10 ? * MON-SUN *
  Achwflschtime:
    Type: String
    Default: 30 15 1 * ? *
  Tcwflschtime:
    Type: String
    Default: 30 13 * * ? *
  adwflschtime:
    Type: String
    Default: 0 10 * * ? *

Conditions:
  IsStdEnv:
    !Or [
      !Equals [!Ref "Environment", prod],
      !Equals [!Ref "Environment", dev]
    ]
  
  IsSbxEnv:
    !Equals [!Ref "Environment", sbx]
  
  IshigherEnv:
    !Or [
      !Equals [!Ref "Environment", prod],
      !Equals [!Ref "Environment", test]
    ]

